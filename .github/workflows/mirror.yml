name: Mirror repository
 
on:
  push:
    branches: [main]
 
jobs:
  mirror:
    if: false # desactive le workflow
    runs-on: ubuntu-latest
    steps:
      - name: Push mirror
        run: |
          git clone --mirror https://git@github.com:pierre54200/Dashboard.git repo-mirror
          cd repo-mirror
          git push https://${{ secrets.MIRROR_TOKEN }}