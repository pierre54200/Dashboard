<div class="register-page">
  <div class="register-card">
    <h1 class="register-title">Créer un compte</h1>

    <form
      class="register-form"
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="register-field">
        <label for="username" class="register-label">Nom d'utilisateur</label>
        <input
          id="username"
          name="username"
          type="text"
          class="input"
          autocomplete="username"
          formControlName="username"
        />
        <p class="field-error" *ngIf="isFieldInvalid('username')">
          {{ getErrorMessage("username") }}
        </p>
      </div>

      <div class="register-field">
        <label for="email" class="register-label">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          class="input"
          autocomplete="email"
          formControlName="email"
        />
        <p class="field-error" *ngIf="isFieldInvalid('email')">
          {{ getErrorMessage("email") }}
        </p>
      </div>

      <div class="register-field">
        <label for="password" class="register-label">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          autocomplete="new-password"
          formControlName="password"
        />
        <p class="field-error" *ngIf="isFieldInvalid('password')">
          {{ getErrorMessage("password") }}
        </p>
      </div>

      <div class="register-field">
        <label for="confirmPassword" class="register-label"
          >Confirmer le mot de passe</label
        >
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          class="input"
          autocomplete="new-password"
          formControlName="confirmPassword"
        />
        <p class="field-error" *ngIf="isFieldInvalid('confirmPassword')">
          {{ getErrorMessage("confirmPassword") }}
        </p>
        <p
          class="field-error"
          *ngIf="
            !isFieldInvalid('confirmPassword') &&
            registerForm.errors?.['passwordMismatch'] &&
            registerForm.get('confirmPassword')?.touched
          "
        >
          Les mots de passe ne correspondent pas
        </p>
      </div>

      <div class="register-terms-field">
        <div class="register-terms">
          <input
            type="checkbox"
            id="terms"
            name="terms"
            formControlName="terms"
            aria-describedby="terms-error"
            [attr.aria-invalid]="isFieldInvalid('terms')"
          />
          <label for="terms">
            J'accepte les
            <a routerLink="/terms" target="_blank" rel="noopener" class="link">conditions d'utilisation</a>
            et la
            <a routerLink="/terms" target="_blank" rel="noopener" class="link">politique de confidentialité</a>
          </label>
        </div>
        <p id="terms-error" class="field-error" *ngIf="isFieldInvalid('terms')">
          {{ getErrorMessage("terms") }}
        </p>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="registerForm.invalid"
      >
        S'inscrire
      </button>

      <p class="register-footer">
        Déjà un compte ? <a href="/login" class="link">Connecte-toi</a>
      </p>
    </form>
  </div>
</div>
