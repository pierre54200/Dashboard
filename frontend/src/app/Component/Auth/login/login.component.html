<div class="login-page">
  <div class="login-card">
    <div class="lang-corner"><app-language-switch [compact]="true" /></div>
    <h1 class="login-title">{{ 'login.title' | t }}</h1>
    <p class="login-subtitle">{{ 'login.subtitle' | t }}</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="login-field">
        <label for="email" class="login-label">{{ 'login.identifier' | t }}</label>
        <input
          id="email"
          name="email"
          type="text"
          class="input"
          autocomplete="username"
          formControlName="username"
        />
      </div>

      <div class="login-field">
        <label for="password" class="login-label">{{ 'auth.password' | t }}</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          autocomplete="current-password"
          formControlName="password"
        />
      </div>

      <!-- <div class="login-row">
        <label class="login-remember">
          <input
            type="checkbox"
            id="remember"
            name="remember"
            formControlName="remember"
          />
          Se souvenir de moi
        </label>
        <a href="#" class="link">Mot de passe oublié ?</a>
      </div> -->

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid"
      >
        {{ 'login.submit' | t }}
      </button>

      <p class="login-footer">
        {{ 'login.need_account' | t }} <a href="/register" class="link">{{ 'login.register' | t }}</a>
      </p>
    </form>
  </div>
</div>
