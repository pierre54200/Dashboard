<div class="dash">
  <header class="topbar">
    <div class="topbar-left">
      <button class="logo" (click)="settings()">D</button>
      <div>
        <h1 class="title">Mon dashboard</h1>
        <p class="subtitle">{{ widgets().length }} widgets · glisse les cartes pour les réorganiser</p>
      </div>
    </div>

    <button type="button" class="btn btn-primary add-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>Ajouter un widget</span>
    </button>
  </header>

  <main class="content">
    <div class="grid" #grid cdkDropList cdkDropListOrientation="mixed" (cdkDropListDropped)="drop($event)">
      @for (w of widgets(); track w.id) {
        <div
          class="slot"
          [class.resizing]="resizingId() === w.id"
          [style.--cols]="w.cols"
          [style.--rows]="w.rows"
          cdkDrag
          cdkDragPreviewContainer="parent"
        >
          <div class="placeholder" *cdkDragPlaceholder [style.--cols]="w.cols" [style.--rows]="w.rows"></div>

          <app-widget-card
            [title]="w.title"
            [service]="w.type"
            [subtitle]="subtitleOf(w)"
            [refreshRate]="w.refreshRate"
            [lastUpdate]="lastUpdate"
            (refresh)="refresh(w)"
            (configure)="configure(w)"
            (remove)="remove(w)"
          >
            @switch (w.type) {
              @case ('weather') {
                <app-weather-widget [city]="$any(w.params['city'])" />
              }
            }
          </app-widget-card>

          <!-- Redimmension -->
          <div
            class="resize-grip"
            role="slider"
            tabindex="0"
            [attr.aria-label]="'Taille du widget ' + w.title"
            aria-valuemin="1"
            [attr.aria-valuemax]="MAX_COLS"
            [attr.aria-valuenow]="w.cols"
            [attr.aria-valuetext]="w.cols + ' colonnes sur ' + w.rows + ' rangées'"
            (pointerdown)="startResize($event, w)"
            (keydown)="resizeWithKeyboard($event, w)"
          >
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M11 3 3 11M11 7 7 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </div>

          @if (resizingId() === w.id) {
            <span class="size-badge">{{ w.cols }} × {{ w.rows }}</span>
          }
        </div>
      } @empty {
        <p class="empty">Ton dashboard est vide. Ajoute un widget pour commencer.</p>
      }
    </div>
  </main>
</div>
