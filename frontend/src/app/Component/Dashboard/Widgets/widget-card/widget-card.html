<article class="card">
  <header class="card-header">
    <button type="button" class="handle" cdkDragHandle [attr.aria-label]="'card.move' | t">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="8" cy="5" r="2" /><circle cx="16" cy="5" r="2" />
        <circle cx="8" cy="12" r="2" /><circle cx="16" cy="12" r="2" />
        <circle cx="8" cy="19" r="2" /><circle cx="16" cy="19" r="2" />
      </svg>
    </button>

    @if (weather(); as scene) {
      <span class="service-icon weather" [attr.data-scene]="scene" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          @switch (scene) {
            @case ('clear-day') {
              <g class="sun"><circle cx="16" cy="16" r="5.5" /><path d="M16 5v3M16 24v3M5 16h3M24 16h3M8.2 8.2l2.1 2.1M21.7 21.7l2.1 2.1M8.2 23.8l2.1-2.1M21.7 10.3l2.1-2.1" /></g>
            }
            @case ('clear-night') {
              <path class="moon" d="M19.5 7.5a8.5 8.5 0 1 0 5 15.4A9.5 9.5 0 0 1 19.5 7.5z" />
              <circle class="star" cx="9" cy="9" r="1" /><circle class="star" cx="24" cy="8" r=".8" />
            }
            @case ('partly-day') {
              <g class="sun"><circle cx="12" cy="12" r="4.5" /><path d="M12 4v2M4 12h2M6.3 6.3l1.4 1.4M17.7 6.3l-1.4 1.4" /></g>
              <path class="cloud" d="M11 25h11a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.4 1.5A3.8 3.8 0 0 0 11 25z" />
            }
            @case ('partly-night') {
              <path class="moon" d="M14 5.5a6.5 6.5 0 1 0 4.5 11.2A7 7 0 0 1 14 5.5z" />
              <path class="cloud" d="M11 25h11a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.4 1.5A3.8 3.8 0 0 0 11 25z" />
            }
            @case ('fog') {
              <path class="cloud" d="M9 17h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11 1.2A4 4 0 0 0 9 17z" />
              <path class="lines" d="M7 21h18M9 25h14" />
            }
            @case ('rain') {
              <path class="cloud" d="M9 19h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11 1.2A4 4 0 0 0 9 19z" />
              <path class="drops" d="M11 22l-1.5 4M16 22l-1.5 4M21 22l-1.5 4" />
            }
            @case ('snow') {
              <path class="cloud" d="M9 19h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11 1.2A4 4 0 0 0 9 19z" />
              <circle class="flake" cx="11" cy="23" r="1.3" /><circle class="flake" cx="16" cy="26" r="1.3" /><circle class="flake" cx="21" cy="23" r="1.3" />
            }
            @case ('storm') {
              <path class="cloud" d="M9 18h14a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11 1.2A4 4 0 0 0 9 18z" />
              <path class="bolt" d="M17 18l-4 6h3.5l-2 5 5.5-7h-3.5l2-4z" />
            }
            @default {
              <path class="cloud" d="M8 23h16a5 5 0 0 0 0-10 7 7 0 0 0-13 1.5A4.3 4.3 0 0 0 8 23z" />
            }
          }
        </svg>
      </span>
    } @else if (iconUrl() && !iconFailed()) {
      <img class="service-icon photo" [src]="iconUrl()" alt="" width="32" height="32" referrerpolicy="no-referrer" (error)="iconFailed.set(true)" />
    } @else {
      <span class="service-icon" [attr.data-service]="service()">{{ service().charAt(0).toUpperCase() }}</span>
    }

    <div class="titles">
      <h2 class="title">{{ title() }}</h2>
      <p class="subtitle">{{ service() }}@if (subtitle()) { · {{ subtitle() }} }</p>
    </div>

    <div class="actions">
      <button type="button" class="icon-btn" [class.spinning]="loading()" [attr.aria-busy]="loading()" (click)="refresh.emit()" [attr.aria-label]="'card.refresh' | t" [title]="'card.refresh' | t">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
        </svg>
      </button>
      <button type="button" class="icon-btn" (click)="configure.emit()" [attr.aria-label]="'card.edit' | t" [title]="'card.edit' | t">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <button type="button" class="icon-btn danger" (click)="remove.emit()" [attr.aria-label]="'card.remove' | t" [title]="'card.remove' | t">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" />
        </svg>
      </button>
    </div>
  </header>

  <div class="body">
    <ng-content />
  </div>

  <footer class="footer">
    <span>{{ refreshLabel() }}</span>
    @if (lastUpdate()) {
      <span>{{ 'card.updated_at' | t: { time: updatedAt() } }}</span>
    }
  </footer>
</article>
