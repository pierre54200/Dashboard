<article class="card">
  <header class="card-header">
    <button type="button" class="handle" cdkDragHandle aria-label="Déplacer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="8" cy="5" r="2" /><circle cx="16" cy="5" r="2" />
        <circle cx="8" cy="12" r="2" /><circle cx="16" cy="12" r="2" />
        <circle cx="8" cy="19" r="2" /><circle cx="16" cy="19" r="2" />
      </svg>
    </button>

    <span class="service-icon">{{ service().charAt(0).toUpperCase() }}</span>

    <div class="titles">
      <h2 class="title">{{ title() }}</h2>
      <p class="subtitle">{{ service() }}@if (subtitle()) { · {{ subtitle() }} }</p>
    </div>

    <div class="actions">
      <button type="button" class="icon-btn" (click)="refresh.emit()" aria-label="Actualiser">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
        </svg>
      </button>
      <button type="button" class="icon-btn" (click)="configure.emit()" aria-label="Modifier le widget" title="Modifier">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <button type="button" class="icon-btn danger" (click)="remove.emit()" aria-label="Supprimer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" />
        </svg>
      </button>
    </div>
  </header>

  <div class="body">
    <ng-content />
  </div>

  <footer class="footer">
    <span>Actualisé {{ refreshLabel() }}</span>
    @if (lastUpdate()) {
      <span>Mis à jour à {{ lastUpdate()!.toLocaleTimeString('fr-FR') }}</span>
    }
  </footer>
</article>
